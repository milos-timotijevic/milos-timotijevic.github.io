name: Submit changed URLs to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "5f8f60c227a48ff8f435ee77f8aceacc.txt"
      - "scripts/submit_indexnow.py"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-main
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Submit changed public HTML URLs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python scripts/submit_indexnow.py \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA"
