name: Audit OpenAlex bibliography matches

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare OpenAlex with site bibliography (read-only)
        run: python scripts/openalex_reconcile.py
      - name: Upload comparison CSV for manual review
        uses: actions/upload-artifact@v4
        with:
          name: openalex-reconciliation
          path: openalex_reconciliation.csv
          retention-days: 30
